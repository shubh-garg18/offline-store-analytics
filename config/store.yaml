store_id: ST1008
store_name: Purplle, Brigade Road, Bangalore
timezone: Asia/Kolkata
clips_dir: data/clips
outputs_dir: outputs

# yolo11n is the smallest YOLO11 model, pretrained on COCO, fast enough for a laptop CPU. yolo11s was
# tried too (outputs/evaluation.md): twice the CPU time for no measurable gain.
# confidence is the lowest detection score passed on to the tracker.
detection:
  model: yolo11n.pt
  confidence: 0.25

# clock_start is the time burned into frame 0 of each clip (store-local IST).
cameras:
  - id: entry
    clip: CAM 3 - entry.mp4
    role: entry
    clock_start: "2026-04-10 20:10:00"
    clock_note: The burned-in clock is blurred on this camera. Estimated from the other three, which start between 20:09:48 and 20:10:27, so expect about 30 s of error.
    # The door is at the bottom-left, between the backlit sign and the lower end of the glass, mostly
    # below the frame edge. Feet below the line are outside; the store floor is on the "inside" side.
    door_line: [[0.20, 0.95], [0.44, 0.95]]
    inside: [0.45, 0.60]

  - id: zone_1
    clip: CAM 1 - zone.mp4
    role: zone
    clock_start: "2026-04-10 20:10:27"
    zones:
      face_shop_wall: [[0.04, 0.90], [0.30, 0.82], [0.30, 1.0], [0.04, 1.0]]
      dermaco_wall: [[0.42, 0.66], [0.68, 0.60], [0.68, 0.72], [0.44, 0.76]]
      minimalist_wall: [[0.68, 0.52], [0.82, 0.52], [0.82, 0.70], [0.68, 0.70]]
      summer_display: [[0.38, 0.76], [0.64, 0.76], [0.64, 1.0], [0.38, 1.0]]
      right_vanity: [[0.82, 0.80], [1.0, 0.80], [1.0, 1.0], [0.82, 1.0]]

  - id: zone_2
    clip: CAM 2 - zone.mp4
    role: zone
    clock_start: "2026-04-10 20:10:02"
    zones:
      vanity_mirror: [[0.0, 0.70], [0.18, 0.70], [0.18, 0.92], [0.0, 0.92]]
      perfume_table: [[0.22, 0.52], [0.36, 0.52], [0.36, 0.80], [0.22, 0.80]]
      lakme_wall: [[0.36, 0.66], [0.62, 0.66], [0.62, 0.86], [0.36, 0.86]]
      maybelline_wall: [[0.62, 0.72], [0.76, 0.72], [0.76, 0.98], [0.62, 0.98]]
      summer_display: [[0.36, 0.86], [0.62, 0.86], [0.62, 1.0], [0.36, 1.0]]

  - id: billing
    clip: CAM 5 - billing.mp4
    role: billing
    clock_start: "2026-04-10 20:09:48"
    # Customers queue on the left of the counter; staff work behind it and in the back room.
    queue_area: [[0.0, 0.40], [0.18, 0.40], [0.12, 0.75], [0.10, 1.0], [0.0, 1.0]]
    staff_area: [[0.40, 0.05], [0.60, 0.05], [0.60, 1.0], [0.36, 1.0], [0.38, 0.45]]

events:
  min_track_seconds: 1.0
  debounce_seconds: 0.33
  match_tolerance_seconds: 2.0

