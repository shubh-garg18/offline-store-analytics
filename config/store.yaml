store_id: ST1008
store_name: Purplle, Brigade Road, Bangalore
timezone: Asia/Kolkata
clips_dir: data/clips
outputs_dir: outputs

# model: yolo11n fine-tuned on 328 frames from this store (outputs/finetune.md). Same size and
# CPU speed as the pretrained yolo11n, but on held-out frames recall rose from 0.69 to 0.87 and mAP50-95
# from 0.59 to 0.77, and on the held-out tail of zone_2 the occupancy error fell (summer display 0.56 to
# 0.28). It is not in the repo: build it with `python -m src.kaggle_job` or `python -m src.finetune`, or
# set model back to yolo11n.pt. yolo11s was rejected earlier (outputs/evaluation.md): twice the CPU time
# for no measurable gain.
# confidence: what model.track receives. ByteTrack's second pass matches boxes scored 0.10 to 0.25 to
# existing tracks (new tracks still need 0.25), so 0.25 here switched that pass off. 0.10 gave fewer
# flicker tracks and fewer censored zone visits with unchanged occupancy error (outputs/finetune.md, section 1).
detection:
  model: outputs/models/store_yolo11n.pt
  confidence: 0.10

# clock_start is the time burned into frame 0 of each clip (store-local IST).
cameras:
  - id: entry
    clip: CAM 3 - entry.mp4
    role: entry
    clock_start: "2026-04-10 20:10:00"
    clock_note: The burned-in clock is blurred on this camera. Estimated from the other three, which start between 20:09:48 and 20:10:27, so expect about 30 s of error.
    # The door is at the bottom-left, between the backlit sign and the lower end of the glass, mostly
    # below the frame edge. Feet below the line are outside; the store floor is on the "inside" side.
    door_line: [[0.20, 0.95], [0.44, 0.95]]
    inside: [0.45, 0.60]

  - id: zone_1
    clip: CAM 1 - zone.mp4
    role: zone
    clock_start: "2026-04-10 20:10:27"
    zones:
      face_shop_wall: [[0.04, 0.90], [0.30, 0.82], [0.30, 1.0], [0.04, 1.0]]
      dermaco_wall: [[0.42, 0.66], [0.68, 0.60], [0.68, 0.72], [0.44, 0.76]]
      minimalist_wall: [[0.68, 0.52], [0.82, 0.52], [0.82, 0.70], [0.68, 0.70]]
      summer_display: [[0.38, 0.76], [0.64, 0.76], [0.64, 1.0], [0.38, 1.0]]
      right_vanity: [[0.82, 0.80], [1.0, 0.80], [1.0, 1.0], [0.82, 1.0]]

  - id: zone_2
    clip: CAM 2 - zone.mp4
    role: zone
    clock_start: "2026-04-10 20:10:02"
    zones:
      vanity_mirror: [[0.0, 0.70], [0.18, 0.70], [0.18, 0.92], [0.0, 0.92]]
      perfume_table: [[0.22, 0.52], [0.36, 0.52], [0.36, 0.80], [0.22, 0.80]]
      lakme_wall: [[0.36, 0.66], [0.62, 0.66], [0.62, 0.86], [0.36, 0.86]]
      maybelline_wall: [[0.62, 0.72], [0.76, 0.72], [0.76, 0.98], [0.62, 0.98]]
      summer_display: [[0.36, 0.86], [0.62, 0.86], [0.62, 1.0], [0.36, 1.0]]

  - id: billing
    clip: CAM 5 - billing.mp4
    role: billing
    clock_start: "2026-04-10 20:09:48"
    # Customers queue on the left of the counter; staff work behind it and in the back room.
    queue_area: [[0.0, 0.40], [0.18, 0.40], [0.12, 0.75], [0.10, 1.0], [0.0, 1.0]]
    staff_area: [[0.40, 0.05], [0.60, 0.05], [0.60, 1.0], [0.36, 1.0], [0.38, 0.45]]

# The same store's bills for the same day. Only order_id, order_date, order_time, store_id and total_amount are
# read: the file also holds customer names and phone numbers. A visitor counts as converted if they joined the
# billing queue within conversion_window_minutes before a bill.
pos:
  csv: data/pos/brigade_road_2026-04-10.csv
  conversion_window_minutes: 5

events:
  min_track_seconds: 1.0
  debounce_seconds: 0.33
  match_tolerance_seconds: 2.0

# Fine-tuning the small detector on frames from this store (src/finetune.py).
finetune:
  student_model: yolo11n.pt
  teacher_model: yolo11x.pt
  teacher_confidence: 0.3
  # Weaker teacher boxes are kept as candidates the review can accept, instead of drawing boxes by hand.
  teacher_candidate_confidence: 0.1
  teacher_imgsz: 960
  # Every teacher box is reviewed by eye, and frames closer than about 1 s apart add little.
  frames_per_camera: 120
  min_gap_seconds: 0.5
  val_fraction: 0.3
  # Frames this close to the train/val boundary are dropped, so no val frame has a near copy in train.
  split_gap_seconds: 2.0
  epochs: 60
  imgsz: 640
  batch: 16
  patience: 15
